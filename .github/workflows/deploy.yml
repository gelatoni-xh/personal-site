name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build app
        run: pnpm build

      - name: Build deploy image archive
        run: |
          docker build -t personal-site:latest .
          docker save personal-site:latest | gzip > personal-site-image.tar.gz

      - name: Copy deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.UBUNTU3_HOST }}
          username: ${{ secrets.UBUNTU3_USER }}
          key: ${{ secrets.UBUNTU3_SSH_KEY }}
          source: "personal-site-image.tar.gz,infra/compose/docker-compose.yml"
          target: "/tmp/personal-site-deploy"

      - name: Deploy on Ubuntu-3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UBUNTU3_HOST }}
          username: ${{ secrets.UBUNTU3_USER }}
          key: ${{ secrets.UBUNTU3_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/apps/personal-site
            cp /tmp/personal-site-deploy/infra/compose/docker-compose.yml /opt/apps/personal-site/docker-compose.yml
            cat > /opt/apps/personal-site/.env <<'EOF'
            PERSONAL_SITE_IMAGE=personal-site:latest
            NEXT_PUBLIC_SITE_URL=https://gelatoni.uk
            EOF
            sudo docker load -i /tmp/personal-site-deploy/personal-site-image.tar.gz
            cd /opt/apps/personal-site
            sudo docker compose up -d
            sudo docker image prune -f
