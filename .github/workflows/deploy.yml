name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build app
        run: pnpm build

      - name: Build deploy image archive
        run: |
          docker build -t personal-site:latest .
          docker save personal-site:latest | gzip > personal-site-image.tar.gz

      - name: Deploy on Ubuntu-3
        env:
          DEPLOY_HOST: ${{ secrets.UBUNTU3_HOST }}
          DEPLOY_USER: ${{ secrets.UBUNTU3_USER }}
          DEPLOY_KEY: ${{ secrets.UBUNTU3_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/personal-site-deploy
          chmod 600 ~/.ssh/personal-site-deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/personal-site-deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /tmp/personal-site-deploy"
          scp -i ~/.ssh/personal-site-deploy \
            personal-site-image.tar.gz \
            infra/compose/docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/personal-site-deploy/"
          ssh -i ~/.ssh/personal-site-deploy "$DEPLOY_USER@$DEPLOY_HOST" <<'EOF'
            set -euo pipefail
            mkdir -p /opt/apps/personal-site
            cp /tmp/personal-site-deploy/docker-compose.yml /opt/apps/personal-site/docker-compose.yml
            cat > /opt/apps/personal-site/.env <<'ENVEOF'
            PERSONAL_SITE_IMAGE=personal-site:latest
            NEXT_PUBLIC_SITE_URL=https://gelatoni.uk
            TASUKI_KEIFU_AGENT_DATABASE_URL=${{ secrets.TASUKI_KEIFU_AGENT_DATABASE_URL }}
            ENVEOF
            sudo docker load -i /tmp/personal-site-deploy/personal-site-image.tar.gz
            cd /opt/apps/personal-site
            sudo docker compose up -d --force-recreate
            for attempt in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/articles >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                sudo docker compose ps
                sudo docker compose logs --tail=100 personal-site
                exit 1
              fi
              sleep 5
            done
            sudo docker image prune -f
          EOF
