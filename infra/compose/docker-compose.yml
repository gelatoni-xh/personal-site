services:
  personal-site:
    image: ${PERSONAL_SITE_IMAGE:-ghcr.io/OWNER/personal-site:latest}
    container_name: personal-site
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/articles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
