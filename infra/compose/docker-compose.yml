services:
  personal-site:
    image: ${PERSONAL_SITE_IMAGE:-personal-site:latest}
    container_name: personal-site
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    networks:
      - tasuki-keifu
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/articles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  tasuki-keifu:
    external: true
    name: tasuki-keifu_default
